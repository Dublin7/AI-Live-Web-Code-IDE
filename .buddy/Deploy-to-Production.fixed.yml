- pipeline: deploy_to_production
  name: Deploy to Production
  refs:
  - :default
  - refs/heads/Mistr
  events:
  - type: PUSH
  terminate_stale_runs: true
  fail_on_prepare_env_warning: true
  concurrent_pipeline_runs: true
  resources: MEDIUM
  actions:
  - action: msbuild
    type: NATIVE_BUILD_WINDOWS
    commands:
    - nuget restore
    - msbuild
    instance_type: GENERAL_MEDIUM
  - action: npm test
    type: BUILD
    docker_image_name: library/node
    docker_image_tag: 22
    execute_commands:
    - "# yarn install"
    - npm install
    - npm test
    services:
    - type: SELENIUM_CHROME
      connection:
        host: selenium-ch
    shell: BASH
