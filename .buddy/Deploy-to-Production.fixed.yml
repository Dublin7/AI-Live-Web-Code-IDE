- pipeline: deploy_to_production
  name: Deploy to Production
  refs:
  - :default
  - refs/heads/Mistr
  events:
  - type: PUSH
  terminate_stale_runs: true
  fail_on_prepare_env_warning: true
  concurrent_pipeline_runs: true
  resources: MEDIUM
  actions:
  - action: msbuild
    type: NATIVE_BUILD_WINDOWS
    commands:
    - nuget restore
    - msbuild
    variables:
    - key: Kij
      value: '!encrypted .aqmleK656TPzVo0WK6Sw6A=='
      type: SSH_KEY
      encrypted: true
      file_path: "~/.ssh/kij"
      file_chmod: 600
      file_place: CONTAINER
      public_value: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF/B99iRv47O3xVi3H6J43g6EIiVXorgKaUshrZnaISN
      key_fingerprint: d4:d1:c6:11:14:b5:a8:ef:d3:4e:d3:87:d6:a0:ad:79
      checksum: b627cf3363f4fdac191dd753085aa52c259b607662f25a44a25b4a3e4dabe760
    sync_paths:
    - pipeline_path: /
      vm_path: c:\buddy
      direction: PIPELINE_TO_VM
    - pipeline_path: ""
      vm_path: ""
      direction: VM_TO_PIPELINE
    - pipeline_path: /
      vm_path: c:\buddy
      direction: VM_TO_PIPELINE
    instance_type: GENERAL_XLARGE
  - action: npm test
    type: BUILD
    docker_image_name: library/node
    docker_image_tag: 22
    execute_commands:
    - "# yarn install"
    - npm install
    - npm test
    services:
    - type: SELENIUM_CHROME
      connection:
        host: selenium-ch
